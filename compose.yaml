name: live-dbms-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-monitoring_db}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-monitoring-local-only}
      TZ: UTC
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - redis-data:/data

  mariadb:
    profiles: [target-db]
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${LOCAL_MARIADB_DB:-target_db}
      MARIADB_USER: ${LOCAL_MARIADB_USER:-collector}
      MARIADB_PASSWORD: ${LOCAL_MARIADB_PASSWORD:-collector-local-only}
      MARIADB_ROOT_PASSWORD: ${LOCAL_MARIADB_ROOT_PASSWORD:-root-local-only}
      TZ: UTC
    ports:
      - "127.0.0.1:${LOCAL_MARIADB_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  postgres-data:
  redis-data:
  mariadb-data:
