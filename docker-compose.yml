# 로컬 개발 전용 의존성 (docs/integration-operations.md 1절 기준).
# 비밀번호는 로컬 격리 환경용 기본값이며 staging/prod에서는 사용하지 않는다.
# 모든 포트는 127.0.0.1에만 바인딩해 외부에 공개하지 않는다.
#
#   docker compose up -d        # 시작
#   docker compose down         # 중지 (데이터 유지)
#   docker compose down -v      # 중지 + 데이터 삭제 (DB 초기화)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 모니터링 대상 테스트 DB. 앱에는 host=127.0.0.1, port=13306, 계정 monitor/monitor로 등록한다.
  mariadb-target:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sample_app
      TZ: UTC
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./infra/local/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mariadb-data:
