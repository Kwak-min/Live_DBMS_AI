plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Actuator
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation('nl.martijndwars:web-push:5.1.2') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.asynchttpclient', module: 'async-http-client'
        exclude group: 'com.beust', module: 'jcommander'
    }
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.apache.httpcomponents:httpasyncclient:4.1.5'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // Data JPA (PostgreSQL System DB) & Redis (Redis Streams MQ)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'org.postgresql:postgresql'

    // Schema migrations (PostgreSQL System DB)
    implementation 'org.flywaydb:flyway-core'

    // Target DBMS Driver (MariaDB)
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.2'

    // AI insights: Gemini(기본, 무료 등급) 또는 Claude
    implementation 'com.google.genai:google-genai:1.75.0'
    implementation 'com.anthropic:anthropic-java:2.68.0'

    // API Documentation (Swagger / OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.4.0')
}

tasks.named('test') {
    useJUnitPlatform()
}

// 로컬 개발 편의: bootRun만 backend/.env(커밋 금지)의 KEY=VALUE를 환경 변수로 넣는다.
// 실제 환경 변수가 이미 있으면 그쪽이 우선한다. 테스트·배포 실행에는 영향을 주지 않는다.
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) return
            def parts = trimmed.split('=', 2)
            def key = parts[0].trim()
            def value = parts[1].trim()
            if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"'))
                    || (value.startsWith("'") && value.endsWith("'")))) {
                value = value.substring(1, value.length() - 1)
            }
            if (key && System.getenv(key) == null) {
                environment key, value
            }
        }
    }
}
