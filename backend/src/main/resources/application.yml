server:
  port: 8080

spring:
  application:
    name: monitoring-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2000ms

app:
  security:
    # Comma-separated CIDRs. Empty means X-Forwarded-For is never trusted.
    trusted-proxy-cidrs: '${TRUSTED_PROXY_CIDRS:}'
  auth:
    jwt-signing-keys: '${JWT_SIGNING_KEYS:}'
    jwt-active-kid: '${JWT_ACTIVE_KID:}'
    public-origin: '${PUBLIC_ORIGIN:http://localhost:5173}'
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
  database-security:
    encryption-keys: '${DB_CONFIG_ENCRYPTION_KEYS:}'
    active-key-version: '${DB_CONFIG_ACTIVE_KEY_VERSION:}'
    verify-on-startup: ${DB_CONFIG_VERIFY_ON_STARTUP:true}
    allowed-cidrs: '${TARGET_DB_ALLOWED_CIDRS:}'
    allowed-ports: '${TARGET_DB_ALLOWED_PORTS:3306}'
  redis:
    stream-key: stream:metrics
    status-stream-key: stream:statuses
    incident-stream-key: stream:incidents
    heartbeat-stream-key: stream:collector-heartbeats
    stream-retention:
      enabled: ${APP_REDIS_STREAM_RETENTION_ENABLED:true}
      interval-ms: ${APP_REDIS_STREAM_RETENTION_INTERVAL_MS:60000}
      # 소비 그룹이 없거나 멈춰도 이보다 오래된 기록은 지운다(pending 기록은 제외). 0이면 상한 없음.
      max-age-hours: ${APP_REDIS_STREAM_RETENTION_MAX_AGE_HOURS:168}
  collector:
    enabled: ${APP_COLLECTOR_ENABLED:true}
    fixed-rate-ms: ${APP_COLLECTOR_FIXED_RATE_MS:5000}
    heartbeat-interval-ms: 10000
    connection-timeout-seconds: 5
  metrics:
    retention-days: ${APP_METRICS_RETENTION_DAYS:30}
    retention-cleanup-enabled: true
    retention-cleanup-cron: "0 0 3 * * *"

monitoring:
  risk:
    enabled: ${RISK_ENABLED:false}
  realtime:
    enabled: ${REALTIME_ENABLED:false}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
  ai:
    # AI 일일 보고서·위험 쿼리 분석. 꺼져 있거나 선택한 제공자의 키가 없으면 생성 API는 503 AI_UNAVAILABLE.
    enabled: ${AI_ENABLED:false}
    # gemini(기본, Google AI Studio 무료 등급 사용 가능) 또는 claude
    provider: ${AI_PROVIDER:gemini}
    gemini-api-key: '${GEMINI_API_KEY:}'
    api-key: '${ANTHROPIC_API_KEY:}'
    # 비우면 제공자 기본 모델(gemini-3.6-flash / claude-opus-5-5)
    model: '${AI_MODEL:}'
    # Gemini만: 기본 모델이 혼잡(503)·한도 초과(429)·응답 없음·단종이면 차례로 시도. 비우면 gemini-3.5-flash,gemini-3.5-flash-lite
    fallback-models: '${AI_FALLBACK_MODELS:}'
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:0}
    effort: ${AI_EFFORT:medium}
    max-output-tokens: 16000
    refusal-fallback: ${AI_REFUSAL_FALLBACK:true}
    daily-report-zone: ${AI_DAILY_REPORT_ZONE:Asia/Seoul}
    daily-report-schedule-enabled: ${AI_DAILY_REPORT_SCHEDULE_ENABLED:true}
    daily-report-cron: "0 10 0 * * *"
    request-cooldown-seconds: ${AI_REQUEST_COOLDOWN_SECONDS:60}
    max-queries-per-analysis: 20
    retention-days: 180
    worker-threads: 2
    worker-queue-capacity: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    # MariaDB 드라이버는 서버 오류 문장(예: "Access denied for user '<계정>'@...")을 그대로 WARN으로 남긴다.
    # 대상 DB 계정은 암호화 보관 대상이므로 끄고, 수집기는 errorCode/sqlState만 별도로 기록한다(T06).
    org.mariadb.jdbc.message.server.ErrorPacket: "OFF"
