server:
  address: 127.0.0.1

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring_db}"
    username: "${SPRING_DATASOURCE_USERNAME:monitoring}"
    password: "${SPRING_DATASOURCE_PASSWORD:monitoring-local-only}"

  data:
    redis:
      host: "${SPRING_REDIS_HOST:localhost}"
      port: "${SPRING_REDIS_PORT:6379}"
      password: "${SPRING_REDIS_PASSWORD:}"

app:
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
