server:
  address: 127.0.0.1

spring:
  config:
    activate:
      on-profile: local
    # backend/.env는 여기서 읽지 않는다. 테스트도 local 프로필을 쓰므로, 여기서 읽으면 개인 .env의
    # 기능 스위치·Redis 주소가 테스트에 섞인다. .env는 bootRun 태스크만 환경 변수로 넣는다(build.gradle).

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring_db}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:postgres}"

  data:
    redis:
      host: "${SPRING_REDIS_HOST:localhost}"
      port: "${SPRING_REDIS_PORT:6379}"
      password: "${SPRING_REDIS_PASSWORD:}"

app:
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
